name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Build Environment
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Prepare Gradle Wrapper & Permissions
        run: |
          echo "=== Repository Contents ==="
          ls -la

          # Normalize line endings to avoid Windows CRLF issues
          sed -i 's/\r$//' ./gradlew 2>/dev/null || true
          sed -i 's/\r$//' ./android/gradlew 2>/dev/null || true

          # Grant execution permissions
          chmod +x ./gradlew 2>/dev/null || true
          chmod +x ./android/gradlew 2>/dev/null || true

          # Ensure project files are present in both root and android/ directories
          if [ -d "android/app" ] && [ ! -d "app" ]; then
            echo "Copying android/app to root..."
            cp -r android/app ./app
          fi
          if [ -d "app" ] && [ ! -d "android/app" ]; then
            echo "Ensuring android/app directory exists..."
            mkdir -p android
            cp -r app android/app
          fi
          if [ -f "android/gradlew" ] && [ ! -f "gradlew" ]; then
            cp android/gradlew ./gradlew
            cp -r android/gradle ./gradle
            chmod +x ./gradlew
          fi

      - name: Build Debug APK
        run: |
          echo "=== Building APK ==="
          if [ -f "./gradlew" ] && { [ -d "./app" ] || [ -f "./build.gradle" ]; }; then
            echo "Building from repository root using ./gradlew..."
            ./gradlew assembleDebug --no-daemon --stacktrace || gradle assembleDebug --no-daemon --stacktrace
          elif [ -d "./android" ] && [ -f "./android/gradlew" ]; then
            echo "Building from android/ subdirectory using ./gradlew..."
            cd android
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace || gradle assembleDebug --no-daemon --stacktrace
            cd ..
          else
            echo "Fallback: Building with system Gradle 8.4..."
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Verify Generated APK
        run: |
          echo "=== Searching for generated APK files ==="
          find . -name "*.apk" -type f -ls

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/**/*.apk
            **/*.apk
          if-no-files-found: error
          retention-days: 30
