name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build Debug APK
      run: |
        echo "=== Checking repository contents ==="
        ls -la
        
        # Auto-detect if files are in root or in android/ subdirectory
        if [ -f "./gradlew" ]; then
          TARGET_DIR="."
        elif [ -f "./android/gradlew" ]; then
          TARGET_DIR="./android"
        elif [ -f "./android/build.gradle" ]; then
          TARGET_DIR="./android"
        else
          TARGET_DIR="."
        fi
        
        echo "Selected project directory: $TARGET_DIR"
        cd "$TARGET_DIR"
        
        # If gradlew exists, ensure execute permission and run
        if [ -f "./gradlew" ]; then
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        else
          echo "Notice: gradlew not found in directory, using installed Gradle 8.4"
          gradle assembleDebug --no-daemon --stacktrace
        fi

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: |
          **/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/**/*.apk
        if-no-files-found: error
