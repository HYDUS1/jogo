    <meta name="description" content="Joint Alert & Support for Health and Personal Emergencies (Ek Tap, Ek Saans, Ek Zindagi). Real-time hands-free voice trigger, sensor fusion, AI triage, and emergency dispatch." />
    <meta property="og:title" content="JASHPI - Hands-Free Emergency Response System" />
    <meta property="og:description" content="Joint Alert & Support for Health and Personal Emergencies (Ek Tap, Ek Saans, Ek Zindagi). Real-time hands-free voice trigger, sensor fusion, AI triage, and emergency dispatch." />
    <meta property="og:type" content="website" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JASHPI" />
    <script>
      // Suppress benign Vite HMR WebSocket disconnections in cloud preview sandbox
      window.addEventListener('error', function(event) {
        if (
          event &&
          ((event.message && (event.message.includes('WebSocket') || event.message.includes('closed without opened'))) ||
           (event.filename && event.filename.includes('@vite/client')))
        ) {
          event.preventDefault?.();
          event.stopImmediatePropagation?.();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (
          event && event.reason &&
          ((typeof event.reason === 'string' && (event.reason.includes('WebSocket') || event.reason.includes('closed without opened'))) ||
           (event.reason.message && (event.reason.message.includes('WebSocket') || event.reason.message.includes('closed without opened'))))
        ) {
          event.preventDefault?.();
          event.stopImmediatePropagation?.();
        }
      }, true);
    </script>

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>
