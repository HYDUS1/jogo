    <script>
      // Suppress benign Vite HMR WebSocket disconnections in cloud preview sandbox
      (function() {
        var origError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            if (arg) {
              var str = typeof arg === 'string' ? arg : (arg.message || String(arg));
              if (
                str.indexOf('WebSocket closed without opened') !== -1 ||
                (str.indexOf('[vite]') !== -1 && str.indexOf('WebSocket') !== -1) ||
                str.indexOf('WebSocket connection to') !== -1
              ) {
                return;
              }
            }
          }
          origError.apply(console, arguments);
        };

        window.addEventListener('error', function(event) {
          if (
            event &&
            ((event.message && (event.message.indexOf('WebSocket') !== -1 || event.message.indexOf('closed without opened') !== -1)) ||
             (event.filename && event.filename.indexOf('@vite/client') !== -1))
          ) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason) {
            var str = typeof event.reason === 'string' ? event.reason : (event.reason.message || '');
            if (str.indexOf('WebSocket') !== -1 || str.indexOf('closed without opened') !== -1) {
              if (event.preventDefault) event.preventDefault();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            }
          }
        }, true);
      })();
    </script>
