<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JASHPI - Hands-Free Emergency Response</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1A0B2E">
</head>
<body>
  <header class="header">
    <div>
      <div class="logo-title">JASHPI</div>
      <div class="tagline">Ek Tap, Ek Saans, Ek Zindagi</div>
    </div>
    <div id="service-status" class="badge badge-active">VOICE: READY</div>
  </header>

  <main>
    <div class="sos-container">
      <button id="sos-btn" class="sos-button">SOS</button>
      <p style="margin-top: 14px; color: #94a3b8; font-size: 13px;">Say <b>"Hello Jashpi"</b> or <b>"Bachao"</b> hands-free</p>
    </div>

    <div class="card">
      <h3 style="color: #00f3ff; margin-bottom: 8px;">System Diagnostics</h3>
      <div style="font-size: 14px; line-height: 1.8;">
        <div>Microphone: <span id="mic-status" style="color: #4ade80;">Active</span></div>
        <div>Location: <span id="gps-status" style="color: #4ade80;">Ready</span></div>
        <div>Sensor Fusion: <span style="color: #4ade80;">Monitoring</span></div>
        <div>Battery: <span id="battery-status">Detecting...</span></div>
      </div>
    </div>

    <div class="card">
      <h3 style="color: #00f3ff; margin-bottom: 8px;">Emergency Contacts</h3>
      <p style="font-size: 13px; color: #94a3b8;">Primary: National Emergency (112), Ambulance (108)</p>
      <button id="call-primary-btn" style="margin-top: 10px; width: 100%; padding: 12px; background: #0044ff; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Direct Call 112</button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
